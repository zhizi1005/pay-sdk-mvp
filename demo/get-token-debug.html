<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>getToken 调试 — Pay SDK Demo</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      .panel label.field {
        display: grid;
        grid-template-columns: 140px 1fr;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        cursor: default;
      }
      .panel label.field input,
      .panel label.field select {
        min-width: 0;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      .actions button {
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      .actions button.secondary {
        background: #444;
      }
      .actions button:disabled {
        background: #bbb;
        color: #666;
        cursor: not-allowed;
      }
      .step {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px 12px;
        margin: 8px 0;
        background: #fafafa;
      }
      .step.ok {
        border-color: #8bc48b;
        background: #f3fbf3;
      }
      .step.fail {
        border-color: #e8a0a0;
        background: #fff5f5;
      }
      .step .step-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .step .badge {
        font-size: 12px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: #ddd;
        color: #333;
      }
      .step.ok .badge {
        background: #c8e6c9;
        color: #1b5e20;
      }
      .step.fail .badge {
        background: #ffcdd2;
        color: #b71c1c;
      }
      .step pre {
        margin: 8px 0 0;
        padding: 8px;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 4px;
        font-size: 11px;
        overflow: auto;
        max-height: 180px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #verdict {
        margin: 16px 0;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background: #f7f7f7;
        font-size: 14px;
        line-height: 1.5;
      }
      #verdict.ok {
        border-color: #8bc48b;
        background: #f3fbf3;
      }
      #verdict.fail {
        border-color: #e8a0a0;
        background: #fff5f5;
      }
    </style>
  </head>
  <body>
    <p class="meta">
      <a href="./index.html">创建订单</a> · <a href="./confirm.html">确认订单</a> ·
      <a href="./result.html">订单结果</a> · <a href="./get-token-debug.html">getToken 调试</a> ·
      <a href="./google-pay-direct.html">DIRECT GP</a>
    </p>
    <h1>getToken 调试</h1>
    <details class="json-fold" open>
      <summary class="section-title">说明</summary>
      <p class="meta">
        分步探测：对照 IP（ipify）与 Alchemy OpenAPI 连通性，再跑签名
        <code>getToken</code>。用于排查「能拿 IP、getToken Failed to fetch / Pending」。右下角
        vConsole 可看日志。
      </p>
    </details>

    <form id="controls" class="panel" onsubmit="return false">
      <fieldset>
        <legend>API</legend>
        <label class="field">
          environment
          <select name="environment">
            <option value="TEST" selected>TEST</option>
            <option value="PRODUCTION">PRODUCTION</option>
          </select>
        </label>
        <label class="field">
          appId
          <input type="text" name="appId" autocomplete="off" />
        </label>
        <label class="field">
          appSecret
          <input type="password" name="appSecret" autocomplete="off" />
        </label>
        <label class="field">
          email
          <input type="email" name="email" autocomplete="off" placeholder="与 uid 二选一" />
        </label>
        <label class="field">
          uid
          <input type="text" name="uid" autocomplete="off" placeholder="与 email 二选一" />
        </label>
        <label class="field">
          getTokenUrl
          <input
            type="url"
            name="getTokenUrl"
            autocomplete="off"
            placeholder="可选覆盖；默认 {apiBase}/open/api/v4/merchant/getToken"
          />
        </label>
        <label class="field">
          timeoutMs
          <input type="number" name="timeoutMs" value="15000" min="1000" step="1000" />
        </label>
      </fieldset>
    </form>

    <div class="actions">
      <button type="button" id="btn-run-all">一键探测</button>
      <button type="button" id="btn-signed-only" class="secondary">仅签名 getToken</button>
    </div>

    <div id="verdict">尚未探测</div>
    <div id="steps"></div>

    <script src="./vendor/vconsole.min.js"></script>
    <script src="./demo-vconsole.js"></script>
    <script src="./config.js"></script>
    <script src="./signed-api.js"></script>
    <script src="./demo-session.js"></script>
    <script>
      ;(function () {
        var form = document.getElementById('controls')
        var stepsEl = document.getElementById('steps')
        var verdictEl = document.getElementById('verdict')
        var btnAll = document.getElementById('btn-run-all')
        var btnSigned = document.getElementById('btn-signed-only')
        var cfg = window.PaySdkDemoConfig || {}
        var session = window.PaySdkDemoSession
        var signedApi = window.PaySdkDemoSignedApi

        function apiBase(environment) {
          return environment === 'PRODUCTION'
            ? 'https://api.alchemypay.org'
            : 'https://api-test.alchemytech.cc'
        }

        function readForm() {
          var fd = new FormData(form)
          var timeoutMs = Number(fd.get('timeoutMs'))
          if (!timeoutMs || timeoutMs < 1000) timeoutMs = 15000
          return {
            environment: fd.get('environment') || 'TEST',
            appId: String(fd.get('appId') || '').trim(),
            appSecret: String(fd.get('appSecret') || '').trim(),
            email: String(fd.get('email') || '').trim(),
            uid: String(fd.get('uid') || '').trim(),
            getTokenUrl: String(fd.get('getTokenUrl') || '').trim(),
            timeoutMs: timeoutMs
          }
        }

        function fillDefaults() {
          var api = (cfg && cfg.api) || {}
          var identity = (session && session.readSavedIdentity && session.readSavedIdentity()) || {}
          var appCreds = (session && session.readSavedCreds && session.readSavedCreds()) || {}
          form.appId.value = appCreds.appId || api.appId || ''
          form.appSecret.value = appCreds.appSecret || api.appSecret || ''
          form.email.value = identity.email || ''
          form.uid.value = identity.uid || ''
        }

        function truncate(value, max) {
          var s = typeof value === 'string' ? value : JSON.stringify(value, null, 2)
          if (!s) return ''
          return s.length > (max || 1200) ? s.slice(0, max || 1200) + '…' : s
        }

        function setBusy(busy) {
          btnAll.disabled = busy
          btnSigned.disabled = busy
        }

        function renderSteps(results) {
          stepsEl.innerHTML = ''
          results.forEach(function (r) {
            var div = document.createElement('div')
            div.className = 'step ' + (r.ok ? 'ok' : 'fail')
            var badge = r.ok ? 'OK' : 'FAIL'
            var head =
              '<div class="step-head"><span>' +
              escapeHtml(r.name) +
              '</span><span class="badge">' +
              badge +
              '</span></div>'
            var meta =
              '<p class="meta" style="margin:6px 0 0">' +
              escapeHtml(r.method || '—') +
              ' ' +
              escapeHtml(r.url || '—') +
              ' · ' +
              (r.durationMs != null ? r.durationMs + 'ms' : '—') +
              (r.httpStatus != null ? ' · HTTP ' + r.httpStatus : '') +
              '</p>'
            var pre = document.createElement('pre')
            pre.textContent = truncate({
              ok: r.ok,
              httpStatus: r.httpStatus,
              errorName: r.errorName,
              errorMessage: r.errorMessage,
              detail: r.detail
            })
            div.innerHTML = head + meta
            div.appendChild(pre)
            stepsEl.appendChild(div)
          })
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
        }

        function fetchWithTimeout(url, init, timeoutMs) {
          var controller = typeof AbortController !== 'undefined' ? new AbortController() : null
          var timer = null
          if (controller) {
            timer = setTimeout(function () {
              controller.abort()
            }, timeoutMs)
          }
          var opts = Object.assign({}, init || {})
          if (controller) opts.signal = controller.signal
          return fetch(url, opts).finally(function () {
            if (timer != null) clearTimeout(timer)
          })
        }

        function withTimeout(promise, timeoutMs, label) {
          return new Promise(function (resolve, reject) {
            var timer = setTimeout(function () {
              var err = new Error((label || 'request') + ' timed out after ' + timeoutMs + 'ms')
              err.name = 'TimeoutError'
              reject(err)
            }, timeoutMs)
            promise.then(
              function (v) {
                clearTimeout(timer)
                resolve(v)
              },
              function (e) {
                clearTimeout(timer)
                reject(e)
              }
            )
          })
        }

        async function runProbe(name, method, url, runner) {
          var started = Date.now()
          var result = {
            name: name,
            method: method,
            url: url,
            durationMs: null,
            ok: false,
            httpStatus: null,
            errorName: null,
            errorMessage: null,
            detail: null
          }
          try {
            var out = await runner()
            result.durationMs = Date.now() - started
            result.ok = !!out.ok
            result.httpStatus = out.httpStatus != null ? out.httpStatus : null
            result.detail = out.detail != null ? out.detail : null
            if (!result.ok && out.errorMessage) {
              result.errorName = out.errorName || 'Error'
              result.errorMessage = out.errorMessage
            }
          } catch (err) {
            result.durationMs = Date.now() - started
            result.ok = false
            result.errorName = (err && err.name) || 'Error'
            result.errorMessage = (err && err.message) || String(err)
            if (result.errorName === 'AbortError') {
              result.errorMessage = 'Aborted (timeout / cancelled): ' + result.errorMessage
            }
            result.detail = {
              tip: 'No HTTP response — network / TLS / blocked / timeout before reply'
            }
          }
          console.log('[get-token-debug]', result.name, result)
          return result
        }

        async function stepEnv() {
          var secure = !!window.isSecureContext
          var subtle = !!(window.crypto && window.crypto.subtle)
          var detail = {
            href: location.href,
            origin: location.origin,
            protocol: location.protocol,
            isSecureContext: secure,
            hasCryptoSubtle: subtle,
            userAgent: navigator.userAgent
          }
          return {
            ok: secure && subtle,
            detail: detail,
            errorMessage: !subtle
              ? 'crypto.subtle unavailable (need HTTPS secure context for HMAC sign)'
              : !secure
                ? 'Not a secure context'
                : null,
            errorName: !subtle || !secure ? 'EnvError' : null
          }
        }

        async function stepIpify(timeoutMs) {
          var url = 'https://api.ipify.org?format=json'
          var response = await fetchWithTimeout(url, { method: 'GET' }, timeoutMs)
          var text = await response.text()
          var data = null
          try {
            data = JSON.parse(text)
          } catch (_) {
            data = { raw: text.slice(0, 200) }
          }
          var ip = data && typeof data.ip === 'string' ? data.ip.trim() : ''
          return {
            ok: response.ok && !!ip,
            httpStatus: response.status,
            detail: { ip: ip || null, body: data }
          }
        }

        async function stepAnyHttp(url, method, init, timeoutMs) {
          var response = await fetchWithTimeout(url, init, timeoutMs)
          var text = ''
          try {
            text = await response.text()
          } catch (_) {
            text = ''
          }
          var bodyPreview = text.slice(0, 400)
          var json = null
          try {
            json = JSON.parse(text)
          } catch (_) {}
          return {
            ok: true,
            httpStatus: response.status,
            detail: {
              note: 'Any HTTP response counts as reachable',
              bodyPreview: bodyPreview,
              json: json
            }
          }
        }

        async function stepSignedGetToken(opts) {
          if (!signedApi || typeof signedApi.getToken !== 'function') {
            return {
              ok: false,
              errorName: 'ConfigError',
              errorMessage: 'PaySdkDemoSignedApi.getToken missing'
            }
          }
          if (!opts.appId || !opts.appSecret) {
            return {
              ok: false,
              errorName: 'ConfigError',
              errorMessage: 'appId / appSecret required'
            }
          }
          if (!opts.email && !opts.uid) {
            return {
              ok: false,
              errorName: 'ConfigError',
              errorMessage: 'email or uid required for getToken'
            }
          }
          try {
            var result = await withTimeout(
              signedApi.getToken({
                environment: opts.environment,
                appId: opts.appId,
                appSecret: opts.appSecret,
                email: opts.email || undefined,
                uid: opts.uid || undefined,
                getTokenUrl: opts.getTokenUrl || undefined
              }),
              opts.timeoutMs,
              'signed getToken'
            )
            return {
              ok: true,
              httpStatus: 200,
              detail: {
                traceId: result.traceId || null,
                accessTokenPreview: result.accessToken
                  ? String(result.accessToken).slice(0, 24) + '…'
                  : null,
                dataKeys: result.data ? Object.keys(result.data) : [],
                envelope: result.envelope || null
              }
            }
          } catch (err) {
            var networkLike =
              (err && err.name === 'TypeError') ||
              (err && err.name === 'TimeoutError') ||
              (err && err.name === 'AbortError') ||
              /Failed to fetch|NetworkError|timed out/i.test((err && err.message) || '')
            return {
              ok: false,
              httpStatus: err && err.status != null ? err.status : null,
              errorName: (err && err.name) || 'Error',
              errorMessage: (err && err.message) || String(err),
              detail: {
                networkLike: networkLike,
                returnCode: err && err.returnCode,
                traceId: err && err.traceId,
                envelope: err && err.envelope
              }
            }
          }
        }

        function buildVerdict(results) {
          var byName = {}
          results.forEach(function (r) {
            byName[r.name] = r
          })
          var env = byName['0 环境']
          var ip = byName['1 对照 IP (ipify)']
          var base = byName['2 API 根 GET']
          var path = byName['3 getToken 路径 GET']
          var post = byName['4 裸 POST（无签名）']
          var signed = byName['5 签名 getToken']

          if (env && !env.ok) {
            return {
              ok: false,
              text: '环境不满足：需要 HTTPS 安全上下文与 crypto.subtle 才能做 HMAC 签名。当前页面协议或 WebView 安全上下文异常。'
            }
          }
          if (ip && !ip.ok) {
            return {
              ok: false,
              text: '对照 IP（ipify）失败 → 外网基本不通，先解决设备/网络，再测 Alchemy API。'
            }
          }
          if (ip && ip.ok && ((base && !base.ok) || (path && !path.ok))) {
            return {
              ok: false,
              text: 'ipify 通、Alchemy API 域名不通（步骤 2/3 失败）。与「能拿 IP、getToken Failed to fetch」一致：被墙/DNS/TLS/运营商拦截 api-test.alchemytech.cc 或 api.alchemypay.org。换网络或 VPN，或由服务端 getToken 后再把 accessToken 填入 Demo。'
            }
          }
          if (base && base.ok && path && path.ok && post && !post.ok) {
            return {
              ok: false,
              text: 'GET 可达但裸 POST 失败 → 可能拦截 POST 或 Content-Type。看步骤 4 的 errorName / 时长。'
            }
          }
          if (post && post.ok && signed && !signed.ok) {
            var d = signed.detail || {}
            if (d.networkLike || signed.httpStatus == null) {
              return {
                ok: false,
                text: '裸 POST 通、签名 getToken 网络失败 → 自定义头 appid/timestamp/sign 可能触发拦截，或签名请求更慢导致超时。可加大 timeoutMs 重试；正式环境请服务端 getToken。'
              }
            }
            return {
              ok: false,
              text:
                '签名 getToken 已收到 HTTP/业务响应但未成功：returnCode=' +
                (d.returnCode || '—') +
                '，' +
                (signed.errorMessage || '') +
                (d.traceId ? '，traceId=' + d.traceId : '') +
                '。属凭据/签名/业务问题，不是域名不通。'
            }
          }
          if (signed && signed.ok) {
            return {
              ok: true,
              text: '签名 getToken 成功。若创单页仍失败，问题在创单或其它链路，不在 getToken 连通性。'
            }
          }
          return {
            ok: false,
            text: '探测未完成或不完整，请点「一键探测」查看各步骤详情。'
          }
        }

        function showVerdict(v) {
          verdictEl.className = v.ok ? 'ok' : 'fail'
          verdictEl.textContent = v.text
        }

        async function runAll() {
          var opts = readForm()
          var base = apiBase(opts.environment)
          var tokenUrl =
            opts.getTokenUrl || base.replace(/\/$/, '') + '/open/api/v4/merchant/getToken'
          var identityBody = {}
          if (opts.email) identityBody.email = opts.email
          else if (opts.uid) identityBody.uid = opts.uid
          else identityBody.email = 'debug@example.com'

          setBusy(true)
          verdictEl.className = ''
          verdictEl.textContent = '探测中…'
          stepsEl.innerHTML = ''
          var results = []

          try {
            results.push(
              await runProbe('0 环境', '—', location.href, function () {
                return stepEnv()
              })
            )
            renderSteps(results)

            results.push(
              await runProbe(
                '1 对照 IP (ipify)',
                'GET',
                'https://api.ipify.org?format=json',
                function () {
                  return stepIpify(opts.timeoutMs)
                }
              )
            )
            renderSteps(results)

            results.push(
              await runProbe('2 API 根 GET', 'GET', base + '/', function () {
                return stepAnyHttp(base + '/', 'GET', { method: 'GET' }, opts.timeoutMs)
              })
            )
            renderSteps(results)

            results.push(
              await runProbe('3 getToken 路径 GET', 'GET', tokenUrl, function () {
                return stepAnyHttp(tokenUrl, 'GET', { method: 'GET' }, opts.timeoutMs)
              })
            )
            renderSteps(results)

            results.push(
              await runProbe('4 裸 POST（无签名）', 'POST', tokenUrl, function () {
                return stepAnyHttp(
                  tokenUrl,
                  'POST',
                  {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(identityBody)
                  },
                  opts.timeoutMs
                )
              })
            )
            renderSteps(results)

            results.push(
              await runProbe('5 签名 getToken', 'POST', tokenUrl, function () {
                return stepSignedGetToken(opts)
              })
            )
            renderSteps(results)

            showVerdict(buildVerdict(results))
            if (session && session.persistCreds) {
              session.persistCreds({ appId: opts.appId, appSecret: opts.appSecret })
            }
            if (session && session.persistIdentity) {
              var prev = (session.readSavedIdentity && session.readSavedIdentity()) || {}
              session.persistIdentity({
                accessToken: prev.accessToken || '',
                email: opts.email,
                uid: opts.uid
              })
            }
          } finally {
            setBusy(false)
          }
        }

        async function runSignedOnly() {
          var opts = readForm()
          var base = apiBase(opts.environment)
          var tokenUrl =
            opts.getTokenUrl || base.replace(/\/$/, '') + '/open/api/v4/merchant/getToken'
          setBusy(true)
          verdictEl.className = ''
          verdictEl.textContent = '签名 getToken 中…'
          stepsEl.innerHTML = ''
          try {
            var results = [
              await runProbe('5 签名 getToken', 'POST', tokenUrl, function () {
                return stepSignedGetToken(opts)
              })
            ]
            renderSteps(results)
            var r = results[0]
            if (r.ok) {
              showVerdict({
                ok: true,
                text: '签名 getToken 成功。traceId 见步骤详情。'
              })
            } else if (r.detail && r.detail.networkLike) {
              showVerdict({
                ok: false,
                text:
                  '签名 getToken 网络失败（' +
                  (r.errorMessage || 'Failed to fetch') +
                  '）。请用「一键探测」对比 ipify 与 API 根是否可达。'
              })
            } else {
              showVerdict({
                ok: false,
                text:
                  '签名 getToken 失败：' +
                  (r.errorMessage || 'unknown') +
                  (r.detail && r.detail.returnCode
                    ? '（returnCode=' + r.detail.returnCode + '）'
                    : '')
              })
            }
          } finally {
            setBusy(false)
          }
        }

        fillDefaults()
        btnAll.addEventListener('click', function () {
          runAll()
        })
        btnSigned.addEventListener('click', function () {
          runSignedOnly()
        })
      })()
    </script>
  </body>
</html>
